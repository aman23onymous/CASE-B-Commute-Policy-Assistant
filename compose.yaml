services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=true
      - JWT_SECRET=demo-secret-key-at-least-32-chars-long-for-hs256!
      - JWT_ISSUER=commute-policy-demo
      - JWT_AUDIENCE=commute-policy-api
      - JWT_TTL_SECONDS=3600
      - SQLITE_PATH=/app/data/registry.sqlite3
      - CHROMA_PATH=/app/data/chroma
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - LLM_PROVIDER=fake
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - RETRIEVAL_MODE=baseline
      - RETRIEVAL_TIMEOUT_SECONDS=0.75
      - LLM_TIMEOUT_SECONDS=2.0
      - REQUEST_TIMEOUT_SECONDS=3.0
      - MAX_POLICY_BYTES=1048576
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data:
